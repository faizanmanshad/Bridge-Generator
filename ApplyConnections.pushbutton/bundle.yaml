title: Apply Connections
tooltip: >
  Automates structural connections for Urbana bridge members.
  Detects beam-to-beam joints from the selected primary main beam
  and applies predefined Revit Structural Connections.
  Supports Concrete Deck and Timber Deck bridge types.
author: Faizan Manshad
min_revit_version: 2022
max_revit_version: 2025
